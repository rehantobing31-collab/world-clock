<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="World Clock — Live time across the globe" />
  <title>🌍 World Clock — Live Time</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="widget-bar" id="widgetBar" hidden>
    <div class="widget-content" id="widgetContent"></div>
    <div class="widget-actions">
      <button class="widget-btn" id="widgetAddBtn" title="Tambah kota">+</button>
      <button class="widget-btn" id="widgetCloseBtn" title="Sembunyikan">✕</button>
    </div>
  </div>

  <button class="widget-show-btn" id="widgetShowBtn" title="Tampilkan widget" hidden>📌</button>

  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1 class="logo">🌍 World Clock</h1>
        <p class="subtitle">Live time across the globe</p>
      </div>
      <div class="header-right">
        <div class="override-badge" id="overrideBadge" hidden>
          ⏱ Time Travel Aktif
          <button id="resetOverride" title="Reset">✕</button>
        </div>

        <button class="format-toggle" id="formatToggle" title="Ganti format jam">24h</button>
        <button class="sound-toggle" id="soundToggle" title="Sound: Off">🔇</button>
        <button class="mood-toggle" id="moodToggle" title="Mood color: Off">🌓</button>
        <button class="cursor-toggle" id="cursorToggle" title="Cursor trail: Off">💫</button>
        <button class="share-btn" id="shareBtn" title="Share screenshot">📸</button>

        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn" id="themeBtn" title="Ganti tema">
            <span id="themeIcon">🌙</span>
          </button>
          <div class="theme-menu" id="themeMenu" hidden>
            <button class="theme-option" data-theme="midnight"><span class="swatch" data-swatch="midnight"></span> Midnight</button>
            <button class="theme-option" data-theme="light"><span class="swatch" data-swatch="light"></span> Light</button>
            <button class="theme-option" data-theme="ocean"><span class="swatch" data-swatch="ocean"></span> Ocean</button>
            <button class="theme-option" data-theme="forest"><span class="swatch" data-swatch="forest"></span> Forest</button>
            <button class="theme-option" data-theme="nord"><span class="swatch" data-swatch="nord"></span> Nord</button>
            <button class="theme-option" data-theme="sepia"><span class="swatch" data-swatch="sepia"></span> Sepia</button>
          </div>
        </div>
      </div>
    </header>

    <section class="override-panel">
      <div class="override-input-group">
        <label for="overrideInput">⏰ Set Waktu (Time Travel)</label>
        <div class="input-row">
          <input type="text" id="overrideInput" placeholder="contoh: 20:15 WIB  /  8:30 PM Singapore" autocomplete="off" />
          <button id="applyOverride" class="btn-primary">Terapkan</button>
          <button id="clearOverride" class="btn-ghost">Reset</button>
        </div>
        <p class="hint" id="overrideHint">
          Format: <code>HH:MM ZONA</code> — zona bisa: WIB, WITA, WIT, UTC, GMT, atau nama kota (Tokyo, London, dll.)
        </p>
      </div>
    </section>

    <section class="pinned-section">
      <h2 class="section-title">⭐ Waktu Utama</h2>
      <div class="pinned-grid" id="pinnedGrid"></div>
    </section>

    <section class="all-section">
      <div class="section-header">
        <h2 class="section-title">🌐 Semua Kota</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Cari kota / negara..." />
        </div>
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="tab active" data-region="all">Semua</button>
        <button class="tab" data-region="Asia">Asia</button>
        <button class="tab" data-region="Europe">Eropa</button>
        <button class="tab" data-region="America">Amerika</button>
        <button class="tab" data-region="Oceania">Oceania</button>
        <button class="tab" data-region="Africa">Afrika</button>
      </div>
      <div class="all-grid" id="allGrid"></div>
    </section>

    <div class="modal" id="pickerModal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Pilih Kota untuk Slot <span id="slotNumber"></span></h3>
          <button class="modal-close" id="closePicker">✕</button>
        </div>
        <input type="text" id="pickerSearch" placeholder="Cari kota..." />
        <div class="picker-list" id="pickerList"></div>
      </div>
    </div>

    <div class="modal" id="widgetPickerModal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h3>Tambahkan Kota ke Widget</h3>
          <button class="modal-close" id="closeWidgetPicker">✕</button>
        </div>
        <input type="text" id="widgetPickerSearch" placeholder="Cari kota..." />
        <div class="picker-list" id="widgetPickerList"></div>
      </div>
    </div>

    <footer class="footer">
      <p>Dibuat dengan ❤️ — Waktu mengikuti timezone IANA resmi</p>
    </footer>
  </div>

  <script src="js/cities.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/format.js"></script>
  <script src="js/sun.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/analog.js"></script>
  <script src="js/aurora.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/share.js"></script>
  <script src="js/easteregg.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/widget.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
